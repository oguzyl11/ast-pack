# Cargo.toml (cleaned)
[package]
name = "ast-pack"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
petgraph = "0.6"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
arboard = "2.0"
# Tree‑sitter core and language crates – unified versions
tree-sitter = "0.27"
# Language crates (compatible versions)
# Note: tree-sitter‑javascript 0.25 works with tree‑sitter 0.27
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.20.0"
tree-sitter-rust = "0.20"
tree-sitter-java = "0.20.0"
tree-sitter-go = "0.20.0"

glob = "0.3"
